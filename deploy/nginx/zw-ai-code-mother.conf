# ============================================================
# zw-ai-code-mother 站点配置（IP 访问版，暂无域名与 HTTPS）
#
# ⚠️ 服务器由宝塔面板管理 nginx，不要直接改 /etc/nginx/nginx.conf（会被宝塔覆盖）。
# 正确做法：宝塔 → 网站 → 添加站点（纯静态即可）→ 打开该站点的「配置文件」→ 替换为以下内容。
#
# 部署前替换：203.195.211.168 → 你的公网 IP
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name 203.195.211.168;

    # 前端 SPA：软链接指向当前发布版本，发布时只切软链接即可原子生效
    root /opt/zw-ai-code-mother/web/current;
    index index.html;

    charset utf-8;

    access_log /www/wwwlogs/zw-ai-code-mother.access.log;
    error_log  /www/wwwlogs/zw-ai-code-mother.error.log;

    # 封面上传上限 10MB（见 application.yml 的 multipart 配置），留出余量
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------------- 前端静态资源 ----------------
    # 前端用的是 createWebHistory（HTML5 History 路由），
    # 直接访问/刷新 /user/login 这类子路由必须回退到 index.html，否则 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------------- 后端 API ----------------
    # proxy_pass 末尾【不能】带斜杠：
    #   写成 http://127.0.0.1:8123   → /api/xxx 原样透传，正好匹配后端 context-path=/api ✓
    #   写成 http://127.0.0.1:8123/  → 会吃掉 /api 前缀，全部 404 ✗
    location /api/ {
        proxy_pass http://127.0.0.1:8123;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 以下四项是 SSE 流式对话的必需配置。
        # 本项目的核心是流式返回 AI 代码生成过程，开启缓冲会导致浏览器长时间收不到数据，
        # 表现为"AI 回复卡住不出字"。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # ---------------- AI 生成并已部署的应用 ----------------
    # 形如 http://<IP>/apps/{deployKey}/
    # 这里用 root 而不是 alias：靠目录名 apps 与 URL 前缀对齐。
    # alias 配合 try_files 在 nginx 中存在路径解析陷阱，能避则避。
    location /apps/ {
        root /opt/zw-ai-code-mother/data;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 隐藏文件
    location ~ /\. {
        deny all;
    }
}
