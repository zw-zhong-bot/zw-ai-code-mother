# ============================================================
# 生产环境配置
#
# 由 deploy/backend.env 里的 SPRING_PROFILES_ACTIVE=prod 激活。
# 覆盖 application.yml 中写死为 local 的部分。
# 敏感值一律走环境变量，本文件不含任何密钥，可以提交仓库。
# ============================================================
spring:
  # MySQL：复用宿主机 Docker 里已有的容器（映射到 127.0.0.1:3306）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/zw_ai_code_mother?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  # Redis：复用宿主机已有的 Redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      ttl: 3600

server:
  port: 8123
  # 关键：只绑回环地址，由 nginx 反代。8123 不对外暴露。
  # 容器用的是 host 网络，若不限制会被公网直接访问到。
  address: 127.0.0.1
  servlet:
    context-path: /api

# 大模型（缺少 DEEPSEEK_API_KEY 时应用仍可启动，但生成功能会调用失败）
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.scnet.cn/api/llm/v1
      api-key: ${DEEPSEEK_API_KEY}
      # model-name 必须是端点真实存在的模型：scnet 不支持 deepseek-chat（返回 422 Model Not Exist）
      model-name: DeepSeek-V4.1-Flash
      max-tokens: 8192
      temperature: 0.7
      timeout: 120s
      # 生产关闭请求/响应日志，避免密钥与用户提示词进日志
      log-requests: false
      log-responses: false
    streaming-chat-model:
      enabled: true
      base-url: https://api.scnet.cn/api/llm/v1
      api-key: ${DEEPSEEK_API_KEY}
      model-name: DeepSeek-V4.1-Flash
      temperature: 0.7
      timeout: 120s
    # 推理流式模型（Vue 项目生成，带工具调用）
    # 未配置数据库模型配置时由此处兜底
    reasoning-chat-model:
      base-url: https://api.scnet.cn/api/llm/v1
      api-key: ${DEEPSEEK_API_KEY}
      model-name: DeepSeek-V4.1-Flash
      max-tokens: 8192
      log-requests: false
      log-responses: false

# 腾讯云 COS（部署截图上传）
cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ap-guangzhou
    bucket: ${COS_BUCKET}

# 生产关闭接口文档，避免暴露全部 API
knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info
    com.zw.zwaicodemother: info
    dev.langchain4j: warn
